<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Verificar Pago</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<!-- Header -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">ParkingApp</a>
    <form th:action="@{/logout}" method="post" class="d-inline">
      <button type="submit" class="btn btn-outline-light">Cerrar Sesión</button>
    </form>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center text-primary">Verificación de Reserva</h1>

  <div class="card shadow-lg p-4 mx-auto mt-4" style="max-width: 500px;">
    <form method="post" th:action="@{/supervisor/verificar}">
      <div class="mb-3">
        <label class="form-label">Matrícula del Vehículo</label>
        <input type="text" class="form-control" name="matricula" placeholder="Ej: 1234ABC" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Verificar Pago</button>
    </form>
  </div>

  <div class="text-center mt-4" th:if="${matricula != null}">
    <h4>Matrícula: <span th:text="${matricula}"></span></h4>
    <p th:if="${pagado}" class="text-success fw-bold">✅ La reserva ha sido pagada.</p>
    <p th:unless="${pagado}" class="text-danger fw-bold">❌ No se encontró un pago para esta matrícula.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
