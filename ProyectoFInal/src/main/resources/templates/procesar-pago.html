<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Procesar Pago - ParkingApp</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<!-- Header -->
<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">ParkingApp</a>
    <a class="btn btn-outline-light" href="/reserva">Ver Mis Reservas</a>
  </div>
</nav>

<div class="container mt-5">
  <h1 class="text-center text-primary">Procesar Pago</h1>

  <div class="card shadow-lg p-4 mx-auto" style="max-width: 600px;">
    <h5 class="card-title mb-3">Resumen de la Reserva</h5>
    <p><strong>Matrícula:</strong> <span th:text="${matricula}"></span></p>
    <p><strong>Tiempo de Reserva:</strong> <span th:text="${tiempo}">0</span> horas</p>
    <p><strong>Precio Total:</strong> <span th:text="${precio}">0.00</span> €</p>

    <form id="paymentForm" th:action="@{/procesar-pago}" method="post" novalidate onsubmit="return validarFormulario()">
      <input type="hidden" name="userId" th:value="${userId}" />
      <input type="hidden" name="reservaId" th:value="${reservaId}" />
      <input type="hidden" name="matricula" th:value="${matricula}" />
      <input type="hidden" name="tiempo" th:value="${tiempo}" />
      <input type="hidden" name="precio" th:value="${precio}" />
      <input type="hidden" name="zone" id="zone" th:value="${zone}" />

      <div class="mb-3">
        <label for="metodoPago" class="form-label">Método de pago:</label>
        <select name="metodoPago" id="metodoPago" class="form-select" onchange="togglePaymentFields()" required>
          <option value="tarjeta">Tarjeta de Crédito</option>
          <option value="paypal">PayPal</option>
        </select>
      </div>

      <!-- Campos para TARJETA -->
      <div id="tarjetaFields">
        <div class="mb-3">
          <label class="form-label">Número de Tarjeta</label>
          <input type="text" name="numeroTarjeta" id="numeroTarjeta" class="form-control"
                 placeholder="1234567812345678" pattern="^\d{16}$"
                 minlength="16" maxlength="16" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Nombre del Titular</label>
          <input type="text" name="nombreTitular" id="nombreTitular" class="form-control" required />
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Fecha Expiración</label>
            <input type="text" name="expiracion" id="expiracion" class="form-control"
                   placeholder="MM/AA" maxlength="5" pattern="^(0[1-9]|1[0-2])\/\d{2}$" required />
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label">CVV</label>
            <input type="text" name="cvv" id="cvv" class="form-control" placeholder="123"
                   pattern="^\d{3}$" minlength="3" maxlength="3" required />
          </div>
        </div>
      </div>

      <!-- Campos para PAYPAL -->
      <div id="paypalFields" style="display: none;">
        <div class="mb-3">
          <label class="form-label">Correo electrónico de PayPal</label>
          <input type="email" name="paypalEmail" id="paypalEmail" class="form-control"
                 placeholder="correo@ejemplo.com" />
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100">Confirmar y Pagar</button>
    </form>
  </div>

  <div class="text-center mt-3">
    <a href="/reserva" class="btn btn-secondary">Volver a Mis Reservas</a>
  </div>
</div>

<!-- Script -->
<script>
  function togglePaymentFields() {
    const metodo = document.getElementById("metodoPago").value;
    document.getElementById("tarjetaFields").style.display = metodo === "tarjeta" ? "block" : "none";
    document.getElementById("paypalFields").style.display = metodo === "paypal" ? "block" : "none";

    document.getElementById("numeroTarjeta").required = metodo === "tarjeta";
    document.getElementById("nombreTitular").required = metodo === "tarjeta";
    document.getElementById("cvv").required = metodo === "tarjeta";
    document.getElementById("expiracion").required = metodo === "tarjeta";
    document.getElementById("paypalEmail").required = metodo === "paypal";
  }

  function validarFormulario() {
    const metodo = document.getElementById("metodoPago").value;

    if (metodo === "tarjeta") {
      const numero = document.getElementById("numeroTarjeta").value.trim();
      const titular = document.getElementById("nombreTitular").value.trim();
      const cvv = document.getElementById("cvv").value.trim();
      const expiracion = document.getElementById("expiracion").value.trim();

      if (!numero || !titular || !cvv || !expiracion) {
        alert("Por favor, completa todos los campos de la tarjeta.");
        return false;
      }

      if (!/^\d{16}$/.test(numero)) {
        alert("El número de tarjeta debe tener exactamente 16 dígitos.");
        return false;
      }

      if (!/^\d{3}$/.test(cvv)) {
        alert("El CVV debe tener exactamente 3 dígitos.");
        return false;
      }

      if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiracion)) {
        alert("La fecha debe tener el formato MM/AA.");
        return false;
      }
    }

    if (metodo === "paypal") {
      const email = document.getElementById("paypalEmail").value.trim();
      if (!email) {
        alert("Por favor, introduce tu correo de PayPal.");
        return false;
      }
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert("El correo de PayPal no es válido.");
        return false;
      }
    }

    return true;
  }

  document.addEventListener("DOMContentLoaded", () => {
    togglePaymentFields();

    const expInput = document.getElementById("expiracion");
    expInput.addEventListener("input", () => {
      let value = expInput.value.replace(/[^0-9]/g, "");
      if (value.length > 2) {
        value = value.substring(0, 2) + "/" + value.substring(2, 4);
      }
      expInput.value = value;
    });
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      document.getElementById("zone").value = "Zona 1";
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
