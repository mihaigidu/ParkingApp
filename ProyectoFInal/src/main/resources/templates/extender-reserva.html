<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Extender Reserva</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/reserva">← Volver</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 500px;">
        <h2 class="text-center text-primary mb-4">Extender Reserva</h2>

        <form th:action="@{/reserva/extender}" method="post">
            <input type="hidden" name="reservaId" th:value="${reserva.id}" />

            <div class="mb-3">
                <label class="form-label">Matrícula:</label>
                <input type="text" class="form-control" th:value="${reserva.matricula}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Tiempo actual: </label>
                <input type="text" class="form-control" th:value="${reserva.tiempo} + ' minutos'" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label">Nuevo tiempo (minutos):</label>
                <input type="number" name="nuevoTiempo" class="form-control" required placeholder="Ej: 90">
            </div>

            <button type="submit" class="btn btn-success w-100">Confirmar Extensión y Pagar</button>
        </form>
    </div>
</div>

</body>
</html>
