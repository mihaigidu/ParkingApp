<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis Reservas</title>
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
  <link
          rel="stylesheet"
          href="/css/styles.css"
          th:href="@{/css/styles.css}">
  <style>
    /* Estilo personalizado para la tabla de reservas */
    .custom-table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 0.5rem;
      overflow: hidden;
    }
    .custom-table thead {
      background: linear-gradient(90deg, #0d6efd, #6610f2);
    }
    .custom-table thead th {
      color: #fff;
      border: none;
      font-weight: 500;
      padding: 0.75rem 1rem;
      text-transform: uppercase;
      font-size: 0.9rem;
    }
    .custom-table tbody tr {
      transition: background .3s, transform .2s;
    }
    .custom-table tbody tr:hover {
      background: rgba(13,110,253,0.1);
      transform: translateX(5px);
    }
    .custom-table tbody td {
      padding: 0.75rem 1rem;
      vertical-align: middle;
      border-bottom: 1px solid #e9ecef;
      color: #495057;
    }
    .custom-table tbody tr:last-child td {
      border-bottom: none;
    }
    .custom-table .no-data {
      text-align: center;
      color: #6c757d;
      font-style: italic;
    }
  </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a
            class="navbar-brand"
            href="/home"
            th:href="@{/home}">
      ParkingApp
    </a>
    <a
            class="btn btn-outline-light"
            href="/nueva-reserva"
            th:href="@{/nueva-reserva}">
      Nueva Reserva
    </a>
  </div>
</nav>

<div class="container mt-4">
  <h1 class="text-center text-primary mb-4">Mis Reservas</h1>

  <div class="table-responsive">
    <table class="custom-table">
      <thead>
      <tr>
        <th>Matrícula</th>
        <th>Precio (€)</th>
        <th>Zona</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="reserva : ${reservas}">
        <td th:text="${reserva.matricula}">—</td>
        <td th:text="${reserva.precio}">—</td>
        <td th:text="${reserva.zone}">—</td>
        <td th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm')}">—</td>
        <td th:text="${#temporals.format(reserva.fechaReserva.plusMinutes(reserva.tiempo), 'dd/MM/yyyy HH:mm')}">—</td>
      </tr>
      <tr th:if="${#lists.isEmpty(reservas)}">
        <td colspan="5" class="no-data">No hay reservas para mostrar.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
