<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Mis Reservas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="/">ParkingApp</a>
    <a class="btn btn-outline-light" href="/nueva-reserva">Nueva Reserva</a>
  </div>
</nav>

<div class="container mt-4">
  <h1 class="text-center text-primary">Mis Reservas</h1>

  <div class="table-responsive">
    <table class="table …">
      <thead class="table-primary">
      <tr>
        <th>Matrícula</th>
        <th>Precio (€)</th>
        <th>Zona</th>
        <th>Fecha Inicio</th>
        <th>Fecha Fin</th>
        <th>Latitud</th>
        <th>Longitud</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="reserva : ${reservas}">
        <td th:text="${reserva.matricula}"></td>
        <td th:text="${reserva.precio}"></td>
        <td th:text="${reserva.zone}"></td>
        <td th:text="${#temporals.format(reserva.fechaReserva, 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${#temporals.format(reserva.fechaReserva.plusMinutes(reserva.tiempo), 'dd/MM/yyyy HH:mm')}"></td>
        <td th:text="${reserva.latitud != null ? reserva.latitud : '—'}"></td>
        <td th:text="${reserva.longitud != null ? reserva.longitud : '—'}"></td>
      </tr>
      </tbody>
    </table>

  </div>
</div>

</body>
</html>
