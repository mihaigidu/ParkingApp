# .github/workflows/deploy.yml

name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Obtener el código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Instalar Java 21 para compilar
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3) Compilar el proyecto (pom.xml en ProyectoFInal/)
      - name: Build JAR
        working-directory: ProyectoFInal
        run: mvn clean package -DskipTests

      # 4) Cargar clave SSH en ssh-agent
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 5) Subir el JAR directamente como /home/ubuntu/app.jar
      - name: Upload JAR via scp
        run: |
          scp -o StrictHostKeyChecking=no \
            ProyectoFInal/target/ParkingApp-0.0.1-SNAPSHOT.jar \
            ubuntu@${{ secrets.SSH_HOST }}:/home/ubuntu/app.jar

      # 6) Subir los CSS estáticos
      - name: Upload CSS via scp
        run: |
          scp -o StrictHostKeyChecking=no -r \
            ProyectoFInal/src/main/resources/static/css \
            ubuntu@${{ secrets.SSH_HOST }}:/home/ubuntu/website/css

      # 7) Reiniciar el servicio Spring Boot en la EC2
      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl restart parkingapp

      # 8) Recargar Nginx para servir los cambios
      - name: Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

