name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Obtener el código
      - name: Checkout code
        uses: actions/checkout@v3

      # 2) Instalar Java 21 para compilar
      - name: Setup Java 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3) Compilar el proyecto (pom.xml en ProyectoFInal/)
      - name: Build JAR
        working-directory: ProyectoFInal
        run: mvn clean package -DskipTests

      # 4) Cargar clave SSH en ssh-agent para los pasos de ssh/scp
      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      # 5) Subir el JAR directamente como /home/ubuntu/app.jar
      - name: Upload JAR via scp
        run: |
          scp -o StrictHostKeyChecking=no \
            ProyectoFInal/target/ParkingApp-0.0.1-SNAPSHOT.jar \
            ubuntu@${{ secrets.SSH_HOST }}:/home/ubuntu/app.jar

      # 6) Asegurar que el directorio /home/ubuntu/website/css existe y pertenece a ubuntu
      - name: Ensure remote CSS folder exists & permisos
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p /home/ubuntu/website/css
            sudo chown -R ubuntu:ubuntu /home/ubuntu/website

      # 7) Subir los CSS estáticos (solo el contenido de static/css/)
      - name: Upload CSS via scp
        run: |
          # El sufijo “static/css/” copia únicamente los archivos DENTRO de css,
          # evitando que se genere /website/css/css/…
          scp -o StrictHostKeyChecking=no -r \
            ProyectoFInal/src/main/resources/static/css/ \
            ubuntu@${{ secrets.SSH_HOST }}:/home/ubuntu/website/css/

      # 8) Reiniciar el servicio Spring Boot en la EC2
      - name: Restart Spring Boot service
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            sudo chown ubuntu:ubuntu /home/ubuntu/app.jar
            sudo chmod 750 /home/ubuntu/app.jar
            sudo systemctl restart parkingapp.service

      # 9) Recargar Nginx para servir los cambios
      - name: Reload Nginx
        uses: appleboy/ssh-action@master
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx

      # 10) Cache de dependencias Maven (opcional, acelera builds futuros)
      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
